# nginx para la experiencia web de CruCo (sitio estático)
# Se instala en /etc/nginx/sites-available/cruco y se enlaza en sites-enabled.
server {
    listen 80;
    listen [::]:80;
    server_name _;                     # cámbialo por tu dominio cuando lo tengas

    root /var/www/cruco;
    index index.html;

    # El curso es un sitio de archivos: si algo no existe, es un 404 de verdad.
    location / {
        try_files $uri $uri/ =404;
    }

    # Los medios son grandes y no cambian: que el navegador los guarde.
    location ~* \.(mp4|m4a|mp3|woff2|jpg|jpeg|png|svg|vtt)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # El código sí cambia en cada versión: que se revalide siempre.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # El reproductor necesita servir rangos para poder adelantar el audio.
    # nginx lo hace por defecto; esto solo lo deja explícito.
    add_header Accept-Ranges bytes;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 1024;
}
